name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - ".kiro/**"
      - "**/*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - ".kiro/**"
      - "**/*.md"
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup mise (Node.js / pnpm)
        uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Validate (no E2E)
        run: pnpm validate:ci
