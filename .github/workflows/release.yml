name: Release

on:
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup mise (Node.js / pnpm)
        uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Resolve version
        id: version
        run: node scripts/release-version.mjs >> "$GITHUB_OUTPUT"

      - name: Check tag
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          if gh api "repos/${{ github.repository }}/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "::error::tag $tag already exists"
            exit 1
          fi
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::error::release $tag already exists"
            exit 1
          fi

      - name: Check milestone
        id: milestone
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          repo="${{ github.repository }}"

          number=$(gh api "repos/$repo/milestones?state=all&per_page=100" \
            --jq "map(select(.title == \"$tag\")) | first.number // empty")
          if [ -z "$number" ]; then
            echo "::error::milestone with title $tag was not found"
            exit 1
          fi

          state=$(gh api "repos/$repo/milestones?state=all&per_page=100" \
            --jq "map(select(.title == \"$tag\")) | first.state // empty")
          if [ "$state" = "closed" ]; then
            echo "::error::milestone $tag is already closed"
            exit 1
          fi

          open_count=$(gh issue list --repo "$repo" --milestone "$tag" --state open --json number --jq 'length')
          if [ "$open_count" -gt 0 ]; then
            echo "::error::milestone $tag has $open_count open issue(s)"
            gh issue list --repo "$repo" --milestone "$tag" --state open --json number,title \
              --jq '.[] | "#\(.number) \(.title)"'
            exit 1
          fi

          closed_count=$(gh issue list --repo "$repo" --milestone "$tag" --state closed --json number --jq 'length')
          if [ "$closed_count" -eq 0 ]; then
            echo "::error::milestone $tag has no closed issues"
            exit 1
          fi

          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Install E2E browser
        run: pnpm install:e2e-browser

      - name: Validate (E2E included)
        run: pnpm validate

      - name: Package
        run: pnpm package

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-zip
          path: release/${{ steps.version.outputs.zipFileName }}
          if-no-files-found: error

      - name: Build release notes
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          repo="${{ github.repository }}"
          gh issue list --repo "$repo" --milestone "$tag" --state closed --json number,title,labels,url \
            | node scripts/release-notes.mjs --tag "$tag" > release-notes.md

      - name: Create release
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          repo="${{ github.repository }}"
          gh release create "$tag" "release/${{ steps.version.outputs.zipFileName }}" \
            --repo "$repo" --title "$tag" --notes-file release-notes.md

      - name: Close milestone
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          number="${{ steps.milestone.outputs.number }}"
          if ! gh api -X PATCH "repos/$repo/milestones/$number" -f state=closed >/dev/null; then
            echo "::error::release ${{ steps.version.outputs.tag }} was published but closing milestone $number failed; close it manually"
            exit 1
          fi
