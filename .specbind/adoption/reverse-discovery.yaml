excluded_area:
  - product catalog and cross-store search
  - price or inventory monitoring
  - recommendations, performance scoring, and advanced physical compatibility
  - backend, accounts, device sync, external AI, other browsers, and store publication
  - backup, restore, migration, recovery, and complex storage guarantees
  - frozen historical design material and development or release automation as standalone product Specs
