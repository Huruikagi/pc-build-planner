source_revision: bb8dc73f92bb48a861544b0617639308944fc09c
baseline_version: 1.0.0
selected_area: repository-wide product behavior, boundaries, and acceptance evidence
confirmed_proposal:
  reverse_specs:
    - spec: local-data-storage
      responsibility: Local device persistence and reload through a bounded storage interface.
      maintained_intent: Saving and reloading are guaranteed; corrupt or unsupported data may be discarded and reinitialized.
    - spec: project-candidate-management
      responsibility: Projects, incomplete candidates, sources, and user-directed duplicate merging.
      maintained_intent: A candidate may be saved with only a URL when a product name is unavailable.
      depends_on: [local-data-storage]
    - spec: page-capture
      responsibility: User-triggered page extraction and untrusted input handling.
      depends_on: [project-candidate-management]
    - spec: current-build-management
      responsibility: Adopted parts and positive quantities in the current build.
      depends_on: [project-candidate-management]
    - spec: basic-compatibility
      responsibility: Evidence-bearing three-valued checks for five basic standards.
      depends_on: [current-build-management]
  blocking_unknowns: []
observations:
