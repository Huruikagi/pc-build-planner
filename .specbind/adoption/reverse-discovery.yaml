schema_version: 1
source_revision: 84acd1c506d0dc1064f9fa8633a1857972ffd17e
adoption_scope: リポジトリ全体
stage: boundaries_confirmed
boundary_candidates:
  - spec: local-data-storage
    responsibility: 端末内で必要なデータを保存・読み出しし、保存値を扱えるか最低限検証する。バックアップ、復旧、同期、複雑なトランザクション、先回りした抽象化は所有しない。
    evidence_paths:
      - src/model.ts
      - src/storage.ts
      - e2e/parts.spec.ts
    depends_on: []
  - spec: project-candidate-management
    responsibility: プロジェクトと候補パーツを整理し、出典、自動取得値と確認済み値、重複候補の提示と統合を所有する。
    evidence_paths:
      - src/projects.ts
      - src/parts.ts
      - src/duplicates.ts
      - src/parts-screen.tsx
      - e2e/parts.spec.ts
      - e2e/duplicates.spec.ts
    depends_on:
      - local-data-storage
  - spec: page-capture
    responsibility: 利用者の明示操作によるページ情報の抽出、未信頼入力の検証と正規化、一時的な取り込み状態、候補下書きへの受け渡しを所有する。
    evidence_paths:
      - manifest.json
      - src/service-worker.ts
      - src/capture/content-script.ts
      - src/capture/extract.ts
      - src/capture/normalize.ts
      - src/capture/protocol.ts
      - e2e/capture.spec.ts
    depends_on:
      - project-candidate-management
  - spec: current-build-management
    responsibility: プロジェクトごとの現在構成、候補の採用と解除、数量、価格合計を所有する。
    evidence_paths:
      - src/build.ts
      - src/build-screen.tsx
      - e2e/build.spec.ts
    depends_on:
      - project-candidate-management
  - spec: basic-compatibility
    responsibility: 確認済み属性だけを根拠に基本的な互換性を判定し、互換、不適合、情報不足を区別して示す。
    evidence_paths:
      - src/compatibility.ts
      - src/compatibility-screen.tsx
      - e2e/compatibility.spec.ts
    depends_on:
      - current-build-management
observations: []
