proposal:
  reverse_specs:
    - spec: local-data-storage
      responsibility: 端末内の単一データルートを保存・読出し・最低限検証する。
      maintained_intent: 正常なデータを保存して再読込みでき、未初期化、構造破損、保存先利用不能を区別する。バックアップ、復元、同期、複雑なトランザクション、参照修復、回復制御、先回りした抽象化は所有しない。
      evidence_locators:
        - src/storage.ts:1-112
        - src/model.ts:162-183
        - e2e/parts.spec.ts:142-253
    - spec: project-candidate-management
      responsibility: プロジェクトと候補パーツ、取得元、重複候補と利用者が選ぶ統合を管理する。
      maintained_intent: 欠損と未確認を正常に保持し、自動統合せず、統合時も既存の確認済み値を壊さない。
      evidence_locators:
        - src/projects.ts:10-54
        - src/parts.ts:17-250
        - src/duplicates.ts:20-185
        - e2e/parts.spec.ts:122-357
        - e2e/duplicates.spec.ts:64-196
      depends_on:
        - local-data-storage
    - spec: page-capture
      responsibility: 利用者操作によるページ情報の抽出、未信頼入力の検証と正規化、一時状態、候補下書きへの引渡しを管理する。
      maintained_intent: 恒久host権限を持たず、取得値を確定せず、出典と元表記、失敗理由を利用者へ渡す。
      evidence_locators:
        - manifest.json:7-23
        - src/service-worker.ts:16-88
        - src/capture/protocol.ts:15-107
        - src/capture/normalize.ts:20-198
        - e2e/capture.spec.ts:62-253
      depends_on:
        - project-candidate-management
    - spec: current-build-management
      responsibility: プロジェクトごとの現在構成、候補の採用と解除、数量、カテゴリ別表示、価格表示を管理する。
      maintained_intent: 同一候補を重複採用せず、正整数数量だけを保存し、異通貨を単一通貨の合計として示さない。
      evidence_locators:
        - src/build.ts:18-139
        - src/build-screen.tsx:167-313
        - e2e/build.spec.ts:51-147
      depends_on:
        - project-candidate-management
    - spec: basic-compatibility
      responsibility: 現在構成の確認済み属性だけによる基本互換性の3値判定と根拠表示を管理する。
      maintained_intent: 情報不足を不適合と断定せず、互換、不適合、情報不足と不足側を示す。
      evidence_locators:
        - src/compatibility.ts:19-294
        - src/compatibility-screen.tsx:93-164
        - e2e/compatibility.spec.ts:68-219
      depends_on:
        - current-build-management
