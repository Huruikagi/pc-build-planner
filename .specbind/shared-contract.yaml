schema_version: 1
resources:
  - id: locale-messages
    description: 各機能が製品画面で使用する日英の翻訳メッセージを収める共有資産
    paths:
      - _locales/en/messages.json
      - _locales/ja/messages.json
    change_policy: >-
      利用するSpecはContractでこの共有資産を参照し、自身のRequirementsとDesignに必要な
      メッセージを日英で追加・更新できる。文言の意味と必要性は利用側Specが所有する。
      既存キーの削除や名前・プレースホルダーの変更は、そのキーを利用する箇所を確認し、
      影響する利用側の合意と整合させて行う。他機能の文言を無関係な変更で上書きしない。
      ファイル全体を一つのSpecのfile_ownershipへ重複して宣言しない。
      開発用Skillの作業記録・停止報告はこの製品向け翻訳資産への追加を要求しない。
    invariants:
      - 日英のメッセージキー集合を一致させる。
      - 同じキーの日英文言で使用するプレースホルダーの名前と引数の対応を一致させる。
      - 翻訳文言の変更で利用側Specが定める意味と表示条件を変えない。
      - 変更対象以外のメッセージ値とプレースホルダー定義を保持する。
      - 共有資産の利用を理由に機能間の実装順の依存を追加しない。
