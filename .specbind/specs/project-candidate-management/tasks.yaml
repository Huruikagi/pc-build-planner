  - id: "4"
    kind: task
    title: 候補管理の保存結果と画面操作を実拡張で検証する
    details:
    - ビルド済み拡張を読み込む既存のPlaywright E2Eで、プロジェクト管理、候補の保存・補正、取得元、元表記、重複選択を観測する。
    - 取り込み下書きの属性元表記、未確認から確認済みへの遷移、同一URL更新と統合を、保存済みルートと再読込後の画面で確認する。
    completion_criteria:
    - 自動取得値が確認済み値を置き換えず、URL-only候補、複数取得元、未分類候補、重複時の各選択が再読込後も意図どおりであることを観測できる。
    - pnpm validate が候補管理の型、静的検査、ビルド、実拡張E2Eを通して完了する。
