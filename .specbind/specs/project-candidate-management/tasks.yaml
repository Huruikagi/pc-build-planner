schema_version: 1
plan:
  items:
  - id: "1"
    kind: task
    title: 候補と取得元を未確認値のまま扱える永続モデルと変換を整える
    details:
    - プロジェクト、候補、取得元、確認済み値と元表記を、URL-only候補と未分類候補を含めて一貫して扱う。
    - ページ取得の内部型を取り込まず、候補管理が所有する受入入力から下書きを作り、既存カテゴリの属性元表記だけを保持する。
    - 候補またはプロジェクトの削除では、登録済みの候補参照整理変換を候補除去より先に適用し、失敗時は保存対象を変えない。
    completion_criteria:
    - URL-only、未分類、取得元なし、および不完全な候補を保存・再編集でき、選択中プロジェクトと候補の参照整合が保たれる。
    - 取り込み由来の分類と属性元表記は未確認のまま保持され、確認済みの分類・属性や既存consumerのカテゴリ投影を自動変更しない。
    - 候補削除とプロジェクト削除の整理順序、未登録時の削除、および登録変換の失敗時に候補を残すことを検証できる。
    requirement_ids:
    - "1.1"
    - "1.2"
    - "1.3"
    - "1.4"
    - "1.5"
    - "2.1"
    - "2.2"
    - "2.3"
    - "2.4"
    - "2.5"
    - "3.1"
    - "3.2"
    - "3.3"
    - "3.4"
    - "3.5"
    - "3.6"
    - "4.1"
    - "4.2"
    - "4.3"
    - "4.4"
    contracts:
    - candidate-capture-handoff
    - project-candidate-state
    - candidate-deletion-reference-cleanup
  - id: "2"
    kind: task
    title: 候補の重複候補を示し、利用者選択に従って保存または統合する
    details:
    - 同じプロジェクト内だけを対象に、URL、型番、メーカーと名称の一致根拠を用いて重複候補を区別する。
    - 同一URLの再取り込みは取得元の更新として扱い、それ以外は新規保存、既存候補への統合、編集復帰を利用者が選べるようにする。
    - 統合では確認済み値を保持し、取り込み元表記と取得元を失わずに更新する。
    completion_criteria:
    - 重複の可能性だけで候補が自動統合または消去されず、各選択の結果を検証できる。
    - 同一URLと統合のどちらでも既存の確認済み値を置き換えず、異なる属性元表記は最新の取り込み表記として残る。
    requirement_ids:
    - "2.4"
    - "3.4"
    - "3.6"
    - "4.1"
    - "4.2"
    - "4.3"
    - "5.1"
    - "5.2"
    - "5.3"
    - "5.4"
    - "5.5"
    contracts:
    - project-candidate-state
    depends_on:
    - "1"
  - id: "3"
    kind: task
    title: プロジェクトと候補を補正できるSide Panel画面を接続する
    details:
    - プロジェクトの作成、選択、名称変更、削除と、選択中プロジェクトだけの候補一覧を提供する。
    - 候補編集で確認済み入力、取得元、読み取り専用の元表記、不完全さを区別し、入力誤りと保存不能を修正可能な状態として示す。
    - 候補の保存、削除、重複選択への遷移と復帰を、保存済みルートへの一つの変換として接続する。
    completion_criteria:
    - プロジェクト未選択時は作成または選択へ進め、URL-only候補を含む不完全な候補を一覧と編集画面で扱える。
    - 元表記の表示だけでは確認済み値にならず、分類を確認した後だけカテゴリ固有の確認済み属性を入力できる。
    - 削除確認、入力エラー、キーボード操作、フォーカス復帰を利用者が識別できる。
    requirement_ids:
