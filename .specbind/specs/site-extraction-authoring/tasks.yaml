schema_version: 1
plan:
  items:
  - id: "1"
    kind: group
    title: 入力確認と規約判断の手順
    tasks:
    - id: "1.1"
      kind: task
      title: サイト固有抽出の作成に必要な入力と停止結果を定義する
      details:
      - 対象ページ、カテゴリ、要求項目、保存済み資料のローカルパス、判断記録の出力先を固定順で確認し、不足時は登録可能な候補を出さない
      - ページ本文、HTML、画像、商品値、認証情報をリポジトリや判断記録へ残さず、判断記録は開発者が指定したリポジトリ外のローカルパスだけに書く
      completion_criteria:
      - 入力不足、資料読取不能、ページ識別不能、項目欠損の各停止結果が、対象・段階・理由・次に必要なものを示す
      requirement_ids:
      - "1.1"
      - "1.2"
      - "1.3"
    - id: "1.2"
      kind: task
      title: 利用条件を資料読取より先に判定し、判断記録へ残す
      details:
      - 許可、禁止、判断不能の根拠URLと確認日を記録し、禁止または判断不能なら保存資料の読取、候補生成、検証、登録を開始しない
      - 許可時だけ後続の候補生成と検証へ進める
      completion_criteria:
      - 禁止と判断不能では停止理由と次の確認を報告し、許可では判断記録を伴って後続処理へ進める
      requirement_ids:
      - "2.1"
      - "2.2"
      - "2.3"
  - id: "2"
    kind: group
    title: 登録候補と実行時境界の提案
    tasks:
    - id: "2.1"
      kind: task
      title: 保存済み資料から検出可能な項目だけをサイト固有抽出候補として提示する
      details:
      - ページ識別条件、選択規則、由来ラベル、期待値を伴う候補を作り、要求項目のいずれかが検出できなければ候補全体を登録対象にしない
      - 共通項目と対象カテゴリで既に定義される属性だけを受け付け、対応しない属性、未分類の属性、資料に明記されない値を推測または代替しない
      completion_criteria:
      - 候補は検出済みの要求項目だけを表し、許可されない属性または欠損項目を含む候補は登録可能として出力されない
      requirement_ids:
      - "1.1"
      - "1.2"
      - "1.3"
      - "3.1"
    - id: "2.2"
      kind: task
      title: 検証済み候補を page-capture と候補編集の境界へ引き渡せる形で提案する
      details:
      - 登録に必要な実行時変更と、固有由来、元表記、対象カテゴリ、URL、取得時刻、任意の価格を含む未確認値の引渡しを明示する
      - >-
        page-capture と project-candidate-management
        が所有する実行時型、正規化、候補編集、確認済み値への昇格をSkill自身の責務に取り込まない
      completion_criteria:
      - 提案は site-specific の由来、固有規則の失敗時の汎用フォールバック、候補編集へ渡す既存属性の未確認性を検証対象としている
      requirement_ids:
      - "3.1"
      - "3.2"
      - "3.3"
      - "3.4"
      contracts:
      - validated-site-extraction-registration
  - id: "3"
    kind: group
    title: 検証と再生成
    tasks:
    - id: "3.1"
      kind: task
      title: Skill手順の固定検証ケースと判断記録の照合方法を整備する
      details:
      - 規約禁止、規約判断不能、入力不足または項目欠損、初回登録、再生成失敗の各ケースについて、許可される読取範囲、期待結果、判断記録の行を定める
      - 各ケースでSkillの出力と判断記録を照合し、実行時のE2Eだけで手順の順序やローカル資料の非読取を代用しない
      completion_criteria:
      - 全固定ケースが停止または登録可否、判断記録の内容まで観測可能である
      requirement_ids:
      - "2.1"
      - "2.2"
      - "3.1"
      - "3.2"
      - "3.3"
      - "4.1"
      - "4.2"
      - "4.3"
    - id: "3.2"
      kind: task
      title: 登録候補の実拡張検証と再生成時の既存登録保持を手順へ組み込む
      details:
      - >-
        既存の汎用抽出結果を候補追加前に記録し、実在データを含まないfixtureで固有由来、sourceLabel、未確認結果、欠損時の汎用フォールバック、候補編集への引渡しを確認する
      - 再生成は初回と同じ規約確認と検証を繰り返し、検証失敗時は既存登録の置換を提案せず、失敗段階と理由を判断記録へ追記する
      completion_criteria:
      - 登録または更新の提案は指定項目の検証と既存の汎用シナリオの維持を確認した後だけに出る
      - 再生成に失敗しても、以前の検証済み登録を未確認候補で置き換えない
      requirement_ids:
      - "3.1"
      - "3.2"
      - "3.3"
      - "3.4"
      - "4.1"
      - "4.2"
      - "4.3"
      contracts:
      - no-registration-before-permission-and-verification
      - existing-registration-survives-regeneration-failure
execution:
  tasks:
    "1.1":
      status: completed
    "1.2":
      status: completed
