schema_version: 1
plan:
  items:
  - id: "1"
    kind: group
    title: URL起点の収集と利用条件の判断記録
    tasks:
    - id: "1.1"
      kind: task
      title: 代表URLだけから抽出候補の対象を判断できる収集手順を整える
      details:
      - 代表URLを唯一の必須入力として、既存カテゴリ、共通項目、対象カテゴリの既存属性、未明記項目を根拠とともに区別する
      - カテゴリ、対象項目、アクセス、製品根拠を自力で確定できない場合だけ、確認済み範囲と未解決理由をまとめて返し、値やカテゴリを推測しない
      completion_criteria:
      - URLだけの開始、任意のカテゴリまたは項目指定の利用、必要情報が不足する場合の一括した確認依頼を固定手順の照合で確認できる
      - 対象外の属性とページに明記されない値を候補に補わないことを確認できる
      requirement_ids:
      - "1.1"
      - "1.2"
      - "1.3"
      - "1.4"
      - "1.5"
      - "1.6"
      - "4.5"
    - id: "1.2"
      kind: task
      title: 利用条件の根拠を対象作業ごとに記録して継続または限定停止を判断する
      details:
      - 公式な利用条件を探索し、確認した事実、対象作業への解釈、不明点、継続または停止の判断をGit管理対象外の作業単位へ分けて残す
      - 明確な禁止根拠がある作業と依存する後続だけを止め、未発見、不明、曖昧さ、保存制限を根拠なく閲覧、自作コード、架空fixtureの停止へ広げない
      completion_criteria:
      - 明確な禁止、不明点を記録して継続、任意の実ページ資料保存をそれぞれ区別する固定ケースで、根拠や許可を捏造せずに確認できる
      - 作業単位と判断記録の保存失敗では既存単位を変更せず、候補、検証、登録を進めないことを確認できる
      requirement_ids:
      - "2.1"
      - "2.2"
      - "2.3"
      - "2.4"
      - "2.5"
      - "2.6"
      - "3.5"
      - "4.4"
  - id: "2"
    kind: group
    title: 架空fixtureによる登録候補と確認用成果物
    tasks:
    - id: "2.1"
      kind: task
      title: サイト固有抽出の候補を既存のCapture境界へ提案できる形にする
      details:
      - 対象ページで確認した構造を基に、実在ページのHTML、本文、画像、商品値を複製しない最小の架空fixtureと、既存カテゴリ属性だけを読む候補を作る
      - '`page-capture` が消費する静的な抽出元タイプ、fixture、固有規則、汎用抽出へのフォールバックを一組の登録候補として示し、実行時実装や未確認handoffの所有を引き受けない'
      completion_criteria:
      - 候補が未明記値、新しい属性、確認済み値を出力せず、規則が適用できない場合は汎用抽出を残す条件を確認できる
      - 保存資料または候補生成の検証が満たされない場合に、登録または更新の提案を出さないことを確認できる
      requirement_ids:
      - "3.1"
      - "3.2"
      - "3.4"
      - "4.1"
      - "4.2"
      contracts:
      - validated-site-extraction-registration
    - id: "2.2"
      kind: task
      title: 自動検証後の確認用成果物と実サイト手動確認の状態を分けて扱う
      details:
      - '`page-capture` 所有の既存実拡張E2Eと確認用ビルドを登録候補の消費側検証として接続し、代表URL、カテゴリ、確認項目、操作手順だけを含むリンク集と手動確認記録を整える'
      - 自動検証済み・実サイト未確認、成功、不一致を区別し、リンク先の埋込みや自動巡回を行わず、未確認を実サイト対応済みとしない
      completion_criteria:
      - 架空fixtureによる自動E2Eで対象項目、表示、汎用フォールバックを確認でき、失敗時に候補を検証済みとして扱わない
      - 手動確認に必要な入力と記録様式が確認用成果物の引渡し時点で揃い、実サイト確認そのものは最終実装検証に残ることを確認できる
      requirement_ids:
      - "3.1"
      - "3.2"
      - "3.3"
      - "3.4"
      - "3.6"
      - "3.7"
      - "3.8"
      contracts:
      - synthetic-fixture-precedes-manual-verification
      - manual-verification-is-required-for-completion
  - id: "3"
    kind: group
    title: 再生成と手順の固定検証
    tasks:
    - id: "3.1"
      kind: task
      title: Skillの固定検証でURL起点の手順と失敗境界を確認する
      details:
      - URLだけの開始、対象不明、利用条件の限定停止または不明点を伴う継続、実ページHTMLを保存しない検証、作業領域の衝突と保存失敗を固定ケースで確認する
      - '固定手順の照合はSkill自身の責任として成立させ、実拡張E2Eは登録候補ごとの`page-capture`の検証を補うものであって代替にしない'
      completion_criteria:
      - 各固定ケースが読取範囲、判断記録、停止または継続、未登録結果を確認し、実在のページ内容や値を検証資料に残さない
      - 作業領域の消失後に以前の実サイト確認を確認済みとして流用せず、利用条件と代表ページの再確認から開始することを確認できる
      requirement_ids:
      - "1.1"
      - "1.3"
      - "1.6"
      - "2.1"
      - "2.2"
      - "2.3"
      - "2.4"
      - "2.5"
      - "2.6"
      - "3.5"
      - "4.4"
    - id: "3.2"
      kind: task
      title: 再生成の失敗でも既存登録を保持する判断と記録を固定する
      details:
      - 自動E2Eまたは実サイト手動確認の失敗から再生成を開始し、代表URLから既存登録と利用可能なローカル記録を見付けて収集と利用条件確認をやり直す
      - 新候補の生成、保存資料照合、実拡張検証、手動確認のどこで失敗しても、既存登録を置換または削除せず、明確な禁止時だけ静的な選択抑止と汎用抽出へのフォールバックを提案する
      completion_criteria:
      - 再生成の各失敗段階で、既存登録の保持、未登録結果、失敗理由、次に必要なものを記録し、未確認候補による更新提案を出さないことを確認できる
      - '`page-capture` が実行時に利用条件や作業記録を読まず、抑止の選択と汎用フォールバックだけを消費する境界を確認できる'
      requirement_ids:
      - "3.2"
      - "3.3"
      - "3.7"
      - "3.8"
      - "4.1"
      - "4.2"
      - "4.3"
      - "4.4"
      - "4.5"
      contracts:
      - explicit-prohibition-stops-only-affected-work
      - existing-registration-survives-regeneration-failure
