schema_version: 1
plan:
  items:
  - id: "1"
    kind: group
    title: URL起点の収集と利用条件の判断記録
    tasks:
    - id: "1.1"
      kind: task
      title: 代表URLだけから抽出候補の対象を判断できる収集手順を整える
      details:
      - 代表URLを唯一の必須入力として、既存カテゴリ、共通項目、対象カテゴリの既存属性、未明記項目を根拠とともに区別する
      - カテゴリ、対象項目、アクセス、製品根拠を自力で確定できない場合だけ、確認済み範囲と未解決理由をまとめて返し、値やカテゴリを推測しない
      completion_criteria:
      - URLだけの開始、任意のカテゴリまたは項目指定の利用、必要情報が不足する場合の一括した確認依頼を固定手順の照合で確認できる
      - 対象外の属性とページに明記されない値を候補に補わないことを確認できる
      requirement_ids:
      - "1.1"
      - "1.2"
      - "1.3"
      - "1.4"
      - "1.5"
      - "1.6"
      - "4.5"
    - id: "1.2"
      kind: task
      title: 利用条件の根拠を対象作業ごとに記録して継続または限定停止を判断する
      details:
      - 公式な利用条件を探索し、確認した事実、対象作業への解釈、不明点、継続または停止の判断をGit管理対象外の作業単位へ分けて残す
      - 明確な禁止根拠がある作業と依存する後続だけを止め、未発見、不明、曖昧さ、保存制限を根拠なく閲覧、自作コード、架空fixtureの停止へ広げない
      completion_criteria:
      - 明確な禁止、不明点を記録して継続、任意の実ページ資料保存をそれぞれ区別する固定ケースで、根拠や許可を捏造せずに確認できる
      - 作業単位と判断記録の保存失敗では既存単位を変更せず、候補、検証、登録を進めないことを確認できる
      requirement_ids:
      - "2.1"
      - "2.2"
      - "2.3"
      - "2.4"
      - "2.5"
      - "2.6"
      - "3.5"
      - "4.4"
  - id: "2"
    kind: group
    title: 架空fixtureによる登録候補と確認用成果物
    tasks:
    - id: "2.1"
      kind: task
      title: 段階的な登録簿差分とサイト固有抽出候補を引き渡せる形にする
      details:
      - >-
        対象ページで確定したメーカー、公式ドメイン、既存カテゴリから最小の追加または更新登録簿差分を作り、実在ページのHTML、本文、画像、商品値を複製しない架空fixtureと既存カテゴリ属性だけを読む候補を一組にする
      - >-
        未検証の差分と候補は候補専用の実拡張E2E構成だけへ仮適用し、`page-capture`
        から対象項目、由来、未確認handoff、汎用フォールバック、既存シナリオ、`pnpm validate` の結果を受け取る
      - 合格した同じ一組だけを登録可能な入力として引き渡し、登録簿の反映、実行時選択、未確認handoffの所有は`page-capture`へ残す
      completion_criteria:
      - >-
        カテゴリまたはメーカーを一意に決められない場合は登録簿差分を作らず、候補が未明記値、新しい属性、確認済み値を出力せず、固有規則が適用できない場合に汎用抽出を残すことを確認できる
      - 仮適用が既存の登録簿と実行時対象を変更せず、合格前の候補または失敗した検証結果から登録可能な入力を作らないことを確認できる
      requirement_ids:
      - "3.1"
      - "3.2"
      - "3.4"
      - "3.9"
      - "4.1"
      - "4.2"
      contracts:
      - validated-site-extraction-registration
    - id: "2.2"
      kind: task
      title: 自動検証後の確認用成果物と実サイト手動確認の状態を分けて扱う
      details:
      - "`page-capture` 所有の既存実拡張E2Eと確認用ビルドを登録候補の消費側検証として接続し、代表URL、カテゴリ、確認項目、操作手順だけを含むリンク集と手動確認記録を整える"
      - 自動検証済み・実サイト未確認、成功、不一致を区別し、リンク先の埋込みや自動巡回を行わず、未確認を実サイト対応済みとしない
      completion_criteria:
      - 架空fixtureによる自動E2Eで対象項目、表示、汎用フォールバックを確認でき、失敗時に候補を検証済みとして扱わない
      - 手動確認に必要な入力と記録様式が確認用成果物の引渡し時点で揃い、実サイト確認そのものは最終実装検証に残ることを確認できる
      requirement_ids:
      - "3.1"
      - "3.2"
      - "3.3"
      - "3.4"
      - "3.6"
      - "3.7"
      - "3.8"
      contracts:
      - synthetic-fixture-precedes-manual-verification
      - manual-verification-is-required-for-completion
  - id: "3"
    kind: group
    title: 再生成と手順の固定検証
    tasks:
    - id: "3.1"
      kind: task
      title: Skillの固定検証でURL起点の開発手順と限定停止を確認する
      details:
      - >-
        URLだけの開始、対象不明、不明点を記録した継続、明確な禁止根拠による対象作業と依存後続だけの停止、実ページHTMLを保存しない検証、作業領域の衝突と保存失敗を固定ケースで確認する
      - >-
        固定手順の照合はSkill自身の責任として成立させ、禁止時の停止を開発時の候補、検証、登録簿更新と報告に限り、実拡張E2Eは登録候補ごとの`page-capture`の検証を補うものとして扱う
      completion_criteria:
      - 各固定ケースが読取範囲、判断記録、停止または継続、未登録結果を確認し、実在のページ内容や値を検証資料に残さない
      - 作業領域の消失後に以前の実サイト確認を確認済みとして流用せず、利用条件と代表ページの再確認から開始することを確認できる
      requirement_ids:
      - "1.1"
      - "1.3"
      - "1.6"
      - "2.1"
      - "2.2"
      - "2.3"
      - "2.4"
      - "2.5"
      - "2.6"
      - "3.5"
      - "4.4"
    - id: "3.2"
      kind: task
      title: 再生成の失敗でも既存登録を保持し開発時の停止を記録する
      details:
      - 自動E2Eまたは実サイト手動確認の失敗から再生成を開始し、代表URLから既存登録と利用可能なローカル記録を見付けて収集と利用条件確認をやり直す
      - >-
        新候補の生成、実拡張検証、手動確認のどこで失敗しても既存登録を置換または削除せず、明確な禁止根拠が判明した場合は候補の作成と登録簿更新を止めて、根拠、対象作業、停止した後続をローカル記録と開発者への報告に残す
      completion_criteria:
      - 再生成の各失敗段階で、既存登録の保持、未登録結果、失敗理由、次に必要なものを記録し、未確認候補による更新提案を出さないことを確認できる
      - "`page-capture` が実行時に利用条件や作業記録を読まず、既存の登録簿と抽出境界を維持することを確認できる"
      requirement_ids:
      - "3.2"
      - "3.3"
      - "3.7"
      - "3.8"
      - "4.1"
      - "4.2"
      - "4.3"
      - "4.4"
      - "4.5"
      contracts:
      - explicit-prohibition-stops-only-affected-work
      - existing-registration-survives-regeneration-failure
execution:
  tasks:
    "1.1":
      status: completed
    "1.2":
      status: completed
    "2.1":
      status: completed
    "2.2":
      status: completed
    "3.1":
      status: completed
    "3.2":
      status: completed
