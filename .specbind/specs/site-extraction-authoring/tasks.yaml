schema_version: 1
plan:
  items:
  - id: "1"
    kind: group
    title: ローカル資料と利用条件の境界
    tasks:
    - id: "1.1"
      kind: task
      title: ローカル作業領域で一意な実行単位を安全に扱えるようにする
      details:
      - リポジトリ直下のGit管理対象外領域を `.gitignore` とともに定義し、対象と実行を区別する作業単位を作る手順を整備する
      - 既存の作業単位を上書きも自動削除もせず、保存失敗時は登録を変更せず停止する
      completion_criteria:
      - 作業単位にページ資料、判断記録、候補、検証結果を分離して残せる
      - 同名の実行単位と作業領域消失時の停止・再取得条件を確認できる
      requirement_ids:
      - "2.1"
      - "2.4"
      - "3.5"
      - "4.4"
    - id: "1.2"
      kind: task
      title: 利用条件の肯定的判断後だけライブ取得を許可する
      details:
      - 開発者指定URLと利用条件の根拠を記録してから取得へ進む手順を整備する
      - 禁止、判断不能、取得失敗、保存失敗、または作業領域消失では、候補、検証、登録を出さず停止する
      completion_criteria:
      - 禁止と判断不能ではページ資料を読まず、停止理由と再開に必要な根拠を示せる
      - 作業領域消失後は利用条件を再確認し、再取得から再開できる
      requirement_ids:
      - "2.1"
      - "2.2"
      - "2.3"
      - "2.4"
      - "4.4"
  - id: "2"
    kind: group
    title: 保存資料に基づく候補と登録提案
    tasks:
    - id: "2.1"
      kind: task
      title: 保存資料に明記された値だけから登録候補を作る
      details:
      - 指定カテゴリと取得項目を保存資料で確認し、直接読める規則だけを候補に含める
      - 未対応属性、未明記値、または不足項目が一つでもあれば候補全体を登録対象にしない
      completion_criteria:
      - 候補が対象の既存属性と明記値だけを使い、推測や代替を含まないことを確認できる
      - 欠損時に未登録の理由を作業記録へ残せる
      requirement_ids:
      - "3.1"
      - "3.2"
    - id: "2.2"
      kind: task
      title: 検証済み候補だけをpage-captureへの登録候補として提案する
      details:
      - サイト固有規則、由来表示、既存の汎用フォールバック、未確認の元表記を保つ既存handoff境界を一組の提案条件として扱う
      - 由来ラベルを登録規則と実拡張検証の証跡に限り、候補の永続データや確認済み値へ保存しない
      completion_criteria:
      - 保存資料と実拡張の検証に合格するまで登録または更新を提案しない
      - 固有規則が読めない場合も既存の汎用抽出を維持できる
      requirement_ids:
      - "3.3"
      - "3.4"
      - "4.2"
      contracts:
      - validated-site-extraction-registration
  - id: "3"
    kind: group
    title: 固定手順と登録・再生成の検証
    tasks:
    - id: "3.1"
      kind: task
      title: Skillの固定検証を利用条件とローカル資料の失敗境界まで拡張する
      details:
      - 入力不足、禁止、判断不能、許可後の取得、項目欠損、作業領域消失後の再確認と再取得を固定ケースにする
      - 各ケースで読取範囲、停止結果、判断記録、未登録結果を照合する
      completion_criteria:
      - 許可前に資料を読まないことと、失敗時に登録候補を出さないことを固定検証で確認できる
      - 作業領域消失後に以前の判断を流用せず再確認することを確認できる
      requirement_ids:
      - "2.1"
      - "2.2"
      - "2.3"
      - "2.4"
      - "3.5"
      - "4.4"
    - id: "3.2"
      kind: task
      title: 初回登録と再生成を保存資料照合と実拡張検証で確認する
      details:
      - 保存資料での指定項目照合、実在データを含まないfixtureによる実拡張、固有由来、汎用フォールバック、既存汎用シナリオを同じ登録条件として検証する
      - 再生成は同じ確認を繰り返し、失敗時には既存の検証済み登録を保持する
      completion_criteria:
      - "`e2e/capture.spec.ts` と `pnpm validate` で、登録候補の実行時境界と既存汎用抽出の維持を確認できる"
      - 再生成の検証失敗時に更新を提案せず、既存登録を保持できる
      requirement_ids:
      - "3.1"
      - "3.2"
      - "3.3"
      - "3.4"
      - "4.1"
      - "4.2"
      - "4.3"
      contracts:
      - no-registration-before-permission-and-verification
      - existing-registration-survives-regeneration-failure
execution:
  tasks:
    "1.1":
      status: completed
