schema_version: 1
owns:
  - id: site-extraction-authoring-procedure
    description: 開発者が指定したページからサイト固有抽出を規約確認、保存資料の検証、登録、再生成の順で扱う開発用手順
exports:
  - id: validated-site-extraction-registration
    description: 規約確認済みで保存資料と実拡張検証を通過した、page-captureへ登録できるサイト固有抽出候補
consumes: []
invariants:
  - id: no-registration-before-permission-and-verification
    description: 利用条件が禁止または判断不能である場合、あるいは保存資料による検証が失敗した場合、Skillはページ内容を用いた登録または既存登録の置換を行わない
  - id: existing-registration-survives-regeneration-failure
    description: 再生成の候補が検証に失敗しても、既存の検証済みサイト固有抽出は未確認候補で置換されない
file_ownership:
  - id: site-extraction-authoring-skill
    paths:
      - .agents/skills/site-extraction-authoring/SKILL.md
      - .agents/skills/site-extraction-authoring/references
