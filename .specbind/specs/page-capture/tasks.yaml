      completion_criteria:
      - 6組の各組がpreparedまたはunavailableのいずれか一方として記録され、preparedでは実拡張E2Eと確認用ビルド・リンク集が揃う。
      - pnpm validateが通る。
      requirement_ids:
      - "6.5"
      - "6.6"
      - "6.7"
      boundaries:
      - src/capture/site-extractors.ts
      - e2e/capture.spec.ts
