      - preparedが残る最終実装検証はMANUAL_VERIFY_REQUIREDとなり、不一致の手動確認はNO-GOとして修正または再生成へ戻すことを確認できる。
      - pnpm validateが通る。
      requirement_ids: ["6.5", "6.6", "6.7", "6.8"]
