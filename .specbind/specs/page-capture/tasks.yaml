schema_version: 1
plan:
  items:
  - id: "1"
    kind: group
    title: Captureの実行時境界とCPU初回登録
    tasks:
    - id: "1.1"
      kind: task
      title: 未確認属性を含むCapture結果を候補管理のhandoffへ接続する
      details:
      - Captureの共通項目と既存カテゴリ属性を、未信頼入力の検証、session状態、由来表示、未確認handoffまで一貫して扱う。
      - candidate-capture-handoffだけを候補管理との永続的な境界として用い、CaptureResultやページ由来値を確認済み候補または保存済み候補へ直接変換しない。
      - 実拡張E2Eで利用者起点の開始、項目別の由来と元表記、無効入力の棄却、取り込み失敗、タブ寿命、プロジェクト未作成時のhandoffを確認する。
      completion_criteria:
      - 既存カテゴリ属性だけが未確認handoffに含まれ、分類がない属性、未知の属性、ページにない値は候補編集へ渡らない。
      - pnpm validateが通る。
      requirement_ids: ["1.1", "1.2", "1.3", "2.1", "2.2", "2.3", "2.4", "3.1", "3.2", "3.3", "5.4"]
      boundaries: [src/capture, src/app.tsx, src/capture-screen.tsx, e2e/capture.spec.ts]
      contracts: [candidate-capture-handoff]
    - id: "1.2"
      kind: task
      title: 指定されたIntelとAMDのCPU代表URLから登録候補をCaptureへ組み込む
      details:
      - 開発者が指定したIntel Core UltraとAMD Zen 5の各代表URLについて、site-extraction-authoringが返すvalidated-site-extraction-registrationを、登録簿の最小差分、静的な選択、固有規則、架空fixture、実拡張E2Eへ反映する。
      - 登録簿を実行時の唯一の正本として更新し、登録、固有抽出の対応、実サイト手動確認済みを混同しない。新規または変更した利用者向け出典文言は共有locale-messagesへ日英同時に反映し、開発用の利用条件確認または停止報告の文言を追加しない。
      - URL起点の手順が明確な禁止、アクセス不能、代表ページ不在を記録した場合は、その記録に従い、既存登録を保持し、固有抽出を選ばない場合も汎用抽出を維持する。
      completion_criteria:
      - 各CPU組がpreparedまたはunavailableとして記録され、preparedでは商品名、メーカー、型番、カテゴリ、価格、URL、ソケットのうち明記値の由来、汎用フォールバック、未推測の欠損を架空fixtureの実拡張E2Eで確認できる。
      - 固有規則が値を返さないか失敗しても、同じ項目の汎用抽出を利用でき、ページ全体の取り込みを失敗させない。
      - pnpm validateが通る。
      requirement_ids: ["6.1", "6.2", "6.3", "6.4", "6.5", "6.7", "6.8"]
      boundaries: [src/capture/site-extractors.ts, src/capture/manufacturer-domain-map.ts, _locales/en/messages.json, _locales/ja/messages.json, e2e/capture.spec.ts, e2e/fixtures/product-page.ts]
      contracts: [validated-site-extraction-registration, locale-messages]
  - id: "2"
    kind: group
    title: 登録簿の既存対象をカテゴリ別に展開し回帰根拠を保つ
    tasks:
    - id: "2.1"
      kind: task
      title: 登録簿のGPU対象の先行群を展開する
      details:
      - MANUFACTURER_DOMAIN_ENTRIESを対象ドメインとカテゴリの唯一の正本として読み、GPUの先行登録群だけをURL起点の登録候補として扱う。別の一覧や対象数を作らず、登録簿、固有抽出、架空fixture、実拡張E2E、確認用ビルドとリンク集を同じTaskで更新する。
      completion_criteria:
      - 各指定組がpreparedまたはunavailableのいずれか一方として記録され、preparedでは実拡張E2Eと確認用ビルド・リンク集が揃う。
      - pnpm validateが通る。
      requirement_ids: ["6.5", "6.6", "6.7", "6.8"]
      boundaries: [src/capture/manufacturer-domain-map.ts, src/capture/site-extractors.ts, e2e/capture.spec.ts, e2e/fixtures/site-extraction-coverage.ts, e2e/fixtures/site-extraction-links.ts]
