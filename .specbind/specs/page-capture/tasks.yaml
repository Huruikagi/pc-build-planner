      contracts: [validated-site-extraction-registration]
execution:
  tasks:
    "1.1":
      status: completed
    "1.2":
      status: blocked
      blocked_reason: "EXTERNAL_BLOCK: 指定Intel代表URLのwww.intel.co.jpは承認済みRequirementsの固定42ドメインに含まれず、Intelの登録はintel.comのみ。intel.comまたはそのサブドメイン上の代表URLの明示指定、またはintel.co.jpを対象に含めるRequirements変更のスコープ決定が必要。AMD URLは受領済み。実装差分なし。"
