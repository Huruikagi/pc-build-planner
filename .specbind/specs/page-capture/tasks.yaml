schema_version: 1
plan:
  items:
  - id: "1"
    kind: group
    title: Captureの実行時境界とCPU初回登録候補
    tasks:
    - id: "1.1"
      kind: task
      title: 未確認属性を含むCapture結果を候補管理のhandoffへ接続する
      details:
      - Captureの共通項目と既存カテゴリ属性を、未信頼入力の検証、session状態、由来表示、未確認handoffまで一貫して扱う。
      - >-
        candidate-capture-handoffだけを候補管理との永続的な境界として用い、CaptureResultやページ由来値を確認済み候補または保存済み候補へ直接変換しない。
      - 実拡張E2Eで利用者起点の開始、項目別の由来と元表記、無効入力の棄却、取り込み失敗、タブ寿命、プロジェクト未作成時のhandoffを確認する。
      completion_criteria:
      - 既存カテゴリ属性だけが未確認handoffに含まれ、分類がない属性、未知の属性、ページにない値は候補編集へ渡らない。
      - pnpm validateが通る。
      requirement_ids:
      - "1.1"
      - "1.2"
      - "1.3"
      - "2.1"
      - "2.2"
      - "2.3"
      - "2.4"
      - "3.1"
      - "3.2"
      - "3.3"
      - "4.1"
      - "4.2"
      - "4.3"
      - "5.1"
      - "5.2"
      - "5.3"
      - "5.4"
      boundaries:
      - src/capture
      - src/app.tsx
      - src/capture-screen.tsx
      - e2e/capture.spec.ts
      contracts:
      - candidate-capture-handoff
    - id: "1.2"
      kind: task
      title: IntelとAMDのCPU代表URLから登録候補を作成し、Captureへ組み込む
      details:
      - >-
        開発者が指定したIntel Core UltraとAMD Zen
        5の各代表URLについて、このTask内でsite-extraction-authoringをURL起点で実行し、得られたvalidated-site-extraction-registrationをCaptureの静的な選択、固有規則、架空fixture、実拡張E2Eへ組み込む。
      - >-
        代表URLが未指定のまま、カテゴリ、取得項目、利用条件の根拠、確認日、保存HTMLを先に要求しない。URL起点の手順が登録候補を出せない、または明確な禁止・アクセス不能・代表ページ不在を記録した場合は、その結果に従い、実在データを含まないfixtureと既存の汎用抽出を保つ。
      completion_criteria:
      - >-
        各CPU組がpreparedまたはunavailableとして記録され、preparedでは商品名、メーカー、型番、カテゴリ、価格、URL、ソケットのうち明記値の由来、汎用フォールバック、未推測の欠損を架空fixtureの実拡張E2Eで確認できる。
      - 固有規則が値を返さないか失敗しても、同じ項目の汎用抽出を利用でき、ページ全体の取り込みを失敗させない。
      - pnpm validateが通る。
      requirement_ids:
      - "6.1"
      - "6.2"
      - "6.3"
      - "6.4"
      - "6.5"
      - "6.7"
      boundaries:
      - src/capture/site-extractors.ts
      - src/capture/manufacturer-domain-map.ts
      - e2e/capture.spec.ts
      - e2e/fixtures/product-page.ts
      contracts:
      - validated-site-extraction-registration
