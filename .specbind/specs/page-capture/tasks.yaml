schema_version: 1
plan:
  items:
  - id: "1"
    kind: group
    title: Captureの実行時境界とCPU初回検証
    tasks:
    - id: "1.1"
      kind: task
      title: 未確認属性を含むCapture結果を候補管理のhandoffへ接続する
      details:
      - Captureの共通項目と既存カテゴリ属性を、未信頼入力の検証、session状態、由来表示、未確認handoffまで一貫して扱う。
      - >-
        candidate-capture-handoffだけを候補管理との永続的な境界として用い、CaptureResultやページ由来値を確認済み候補または保存済み候補へ直接変換しない。
      - 実拡張E2Eで利用者起点の開始、項目別の由来と元表記、無効入力の棄却、取り込み失敗、タブ寿命、プロジェクト未作成時のhandoffを確認する。
      completion_criteria:
      - 既存カテゴリ属性だけが未確認handoffに含まれ、分類がない属性、未知の属性、ページにない値は候補編集へ渡らない。
      - pnpm validateが通る。
      requirement_ids:
      - "1.1"
      - "1.2"
      - "1.3"
      - "2.1"
      - "2.2"
      - "2.3"
      - "2.4"
      - "3.1"
      - "3.2"
      - "3.3"
      - "4.1"
      - "4.2"
      - "4.3"
      - "5.1"
      - "5.2"
      - "5.3"
      - "5.4"
      boundaries:
      - src/capture
      - src/app.tsx
      - src/capture-screen.tsx
      - e2e/capture.spec.ts
      contracts:
      - candidate-capture-handoff
    - id: "1.2"
      kind: task
      title: IntelとAMDのCPU代表ページでサイト固有抽出を初回検証する
      details:
      - >-
        validated-site-extraction-registrationを入力として、登録済み公式ドメイン照合と固有抽出を既存collectorより先に実行する。
      - >-
        Intel Core UltraとAMD Zen
        5の各CPU代表ページについて、共通項目とソケットの明記値、項目別由来、汎用フォールバック、未推測の欠損を実在データを含まないfixtureと実拡張E2Eで確認する。
      completion_criteria:
      - 固有規則が値を返さないか失敗しても、同じ項目の汎用抽出を利用でき、ページ全体の取り込みを失敗させない。
      - pnpm validateが通る。
      requirement_ids:
      - "6.1"
      - "6.2"
      - "6.3"
      - "6.4"
      - "6.5"
      - "6.7"
      boundaries:
      - src/capture/site-extractors.ts
      - src/capture/manufacturer-domain-map.ts
      - e2e/capture.spec.ts
      - e2e/fixtures/product-page.ts
      contracts:
      - validated-site-extraction-registration
  - id: "2"
    kind: group
    title: 固定67メーカー／カテゴリ組への展開と完了根拠
    tasks:
    - id: "2.1"
      kind: task
      title: GPU前半6組を代表ページ根拠付きで展開する
      details:
      - >-
        Intel、AMD、ASUS、ASRock、MSI、GIGABYTEのGPU組について、site-extraction-authoringの単一ページ登録結果から固有抽出またはunavailable記録を追加し、verified組は実拡張E2Eで確認する。
      completion_criteria:
      - 6組の各組がverifiedまたはunavailableのいずれか一方として記録される。
      - pnpm validateが通る。
      requirement_ids:
      - "6.5"
      - "6.6"
      - "6.7"
      boundaries:
      - src/capture/site-extractors.ts
      - e2e/capture.spec.ts
      - e2e/fixtures/site-extraction-coverage.ts
      contracts:
      - validated-site-extraction-registration
